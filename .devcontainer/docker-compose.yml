services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      # Path is resolved relative to compose's project_directory (= repo root,
      # which is dirname of the first `-f` argument the devcontainer CLI passes).
      # Using `.` here means the repo root; `..` would mount the parent of the
      # repo, which is NOT what we want.
      - .:/workspaces/reign-game:cached
      - go-mod-cache:/home/vscode/go/pkg/mod
      - npm-cache:/home/vscode/.npm
      # Container-local node_modules. Native modules (rolldown, esbuild, etc.)
      # ship platform-specific binaries; sharing node_modules between the
      # macOS host and the Linux container via the workspace bind would have
      # both sides fight over the same dir and break the host's `npm test`
      # the moment the container's `npm ci` ran. This volume override scopes
      # the Linux install to the container.
      - frontend-node-modules:/workspaces/reign-game/frontend/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
      # Host global Claude skills, read-only. Declared here (not in
      # devcontainer.json `mounts`) because the `readonly` flag in
      # devcontainer.json silently doesn't propagate through compose-based
      # containers — `:ro` in compose is honored faithfully.
#      - ${HOME}/.claude/skills:/home/vscode/.claude/skills:ro
      # AWS profile definitions, read-only — lets the container know which
      # profiles exist (start URLs, regions, role names) without granting any
      # active session.
      - ${HOME}/.aws/config:/home/vscode/.aws/config:ro
      # SSO bearer-token cache lives in a container-local named volume, NOT
      # bind-mounted from the host. This separates the host's sign-in (which
      # may have admin scope) from the container's. The user must explicitly
      # `aws sso login` from inside the container to populate this; the cache
      # persists across container recreates so the standard SSO TTL still
      # applies, but a host login alone never reaches the container.
      # ~/.aws/credentials (static keys) and ~/.aws/cli/cache/ (assume-role
      # cache, auto-refreshed from the SSO bearer) are intentionally not
      # mounted at all.
      - aws-sso-cache:/home/vscode/.aws/sso/cache
      # Playwright browser cache. The chromium-headless-shell binary is ~110MB
      # and is re-downloaded every container recreate without this volume.
      - playwright-cache:/home/vscode/.cache/ms-playwright
    # Project-scoped secrets (PAT, AWS_PROFILE, etc.). Optional — the stack
    # still comes up if the file isn't present. Anything in .env.local is
    # set on the dev container's environment without ever passing through
    # the host's shell rc. Path is resolved against project_directory
    # (= repo root, dirname of the first `-f` arg), not the compose file's
    # own directory — same rule we hit for volumes.
    env_file:
      - path: .devcontainer/.env.local
        required: false
    # Publish only what the host browser hits directly. Vite (5180) is the
    # front door; it proxies /api/* to the backend on the container's
    # loopback at 127.0.0.1:5181, so the backend stays unpublished. The
    # backend code hardcodes a 127.0.0.1 bind anyway
    # (backend/cmd/api/main.go).
    ports:
      - "5180:5180"
    command: sleep infinity
    depends_on:
      - localstack

volumes:
  go-mod-cache:
  npm-cache:
  frontend-node-modules:
  aws-sso-cache:
  playwright-cache:
