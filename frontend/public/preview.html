<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reign — Style Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --color-ink: #2D2A26;
  --color-background: #F8F6F3;
  --color-surface: #FFFFFF;
  --color-body: #6B6358;
  --color-muted: #9C9488;
  --color-border: #D6CFC5;
  --color-accent: #4F46E5;
  --color-destructive: #DC2626;
  --color-destructive-bg: #FEE2E2;
  --region-0-fill: #93C5FD;
  --region-1-fill: #FCD34D;
  --region-2-fill: #FDA4AF;
  --region-3-fill: #5EEAD4;
  --region-4-fill: #C4B5FD;
  --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--color-background);
  color: var(--color-ink);
  font-family: 'Nunito Sans', system-ui, sans-serif;
  padding: 16px;
  padding-bottom: 80px;
}
h1 { font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 4px; letter-spacing: -0.01em; }
.subtitle { text-align:center; color:var(--color-muted); font-size:0.875rem; margin-bottom:16px; }
h2 { font-size: 1.125rem; font-weight: 700; margin: 28px 0 8px; color: var(--color-body); }
.option-label { font-size: 0.8rem; font-weight: 600; color: var(--color-body); margin-bottom: 6px; text-align: center; }
.grid-row {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch; padding: 4px 0 16px;
}
.grid-option { flex: 0 0 auto; scroll-snap-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.grid-wrapper { width: calc(100vw - 32px); max-width: 400px; display: flex; justify-content: center; }
</style>
<script>
const R = [
  [0,0,1,1,1],
  [0,0,1,2,2],
  [3,3,1,2,2],
  [3,4,4,4,2],
  [3,3,4,4,4]
];
const markers = [[0,4],[1,1],[2,3],[3,0],[4,2]];
const exclusions = [[0,0],[0,1],[1,3],[2,0],[4,4]];
// Cells to show drag highlight
const dragHighlight = [[1,2],[1,4],[2,4],[3,3],[3,4],[4,3]];

function has(list,r,c) { return list.some(p=>p[0]===r&&p[1]===c); }

function buildGrid(id, opts) {
  const el = document.getElementById(id);
  const sz = 5;
  const wrapper = el.parentElement;
  const available = wrapper.clientWidth - ((opts.outerBorder||2.5)*2);
  const cellSz = Math.floor(available / sz);

  el.style.display = 'inline-grid';
  el.style.gridTemplateColumns = `repeat(${sz},${cellSz}px)`;
  el.style.gridTemplateRows = `repeat(${sz},${cellSz}px)`;
  el.style.border = `${opts.outerBorder||2.5}px solid var(--color-ink)`;
  el.style.borderRadius = 'var(--radius)';
  el.style.boxShadow = '0 3px 0 var(--color-ink)';
  el.style.overflow = 'hidden';

  for (let r = 0; r < sz; r++) {
    for (let c = 0; c < sz; c++) {
      const cell = document.createElement('div');
      const reg = R[r][c];
      const isM = has(markers, r, c);
      const isE = !isM && has(exclusions, r, c);
      const isDrag = !isM && !isE && has(dragHighlight, r, c);

      cell.style.width = cellSz+'px';
      cell.style.height = cellSz+'px';
      cell.style.display = 'flex';
      cell.style.alignItems = 'center';
      cell.style.justifyContent = 'center';
      cell.style.boxSizing = 'border-box';

      if (isDrag) {
        const hlStyle = opts.dragHighlight || 'darken';
        if (hlStyle === 'darken') {
          cell.style.backgroundColor = `color-mix(in srgb, var(--region-${reg}-fill) 70%, var(--color-ink) 30%)`;
        } else if (hlStyle === 'lighten') {
          cell.style.backgroundColor = `color-mix(in srgb, var(--region-${reg}-fill) 70%, white 30%)`;
        } else if (hlStyle === 'border-only') {
          cell.style.backgroundColor = `var(--region-${reg}-fill)`;
          cell.style.outline = '2px solid var(--color-ink)';
          cell.style.outlineOffset = '-3px';
        } else if (hlStyle === 'desaturate') {
          cell.style.backgroundColor = `color-mix(in srgb, var(--region-${reg}-fill) 50%, var(--color-muted) 50%)`;
        } else if (hlStyle === 'accent-tint') {
          cell.style.backgroundColor = `color-mix(in srgb, var(--region-${reg}-fill) 75%, var(--color-accent) 25%)`;
        }
      } else {
        cell.style.backgroundColor = `var(--region-${reg}-fill)`;
      }

      // Borders: right/bottom drawn by this cell, top/left suppressed if adjacent has region border
      const bRight = c < sz-1 && R[r][c] !== R[r][c+1];
      const bBottom = r < sz-1 && R[r][c] !== R[r+1][c];
      const adjLeft = c > 0 && R[r][c] !== R[r][c-1];
      const adjTop = r > 0 && R[r][c] !== R[r-1][c];

      cell.style.borderRightWidth = bRight ? '2.5px' : '1px';
      cell.style.borderRightColor = bRight ? 'var(--color-ink)' : 'rgba(0,0,0,0.07)';
      cell.style.borderBottomWidth = bBottom ? '2.5px' : '1px';
      cell.style.borderBottomColor = bBottom ? 'var(--color-ink)' : 'rgba(0,0,0,0.07)';
      cell.style.borderTopWidth = adjTop ? '0' : '1px';
      cell.style.borderTopColor = 'rgba(0,0,0,0.07)';
      cell.style.borderLeftWidth = adjLeft ? '0' : '1px';
      cell.style.borderLeftColor = 'rgba(0,0,0,0.07)';
      cell.style.borderStyle = 'solid';

      const mSz = cellSz * 0.6;
      const ns = 'http://www.w3.org/2000/svg';

      if (isM) {
        const svg = document.createElementNS(ns,'svg');
        svg.setAttribute('width', mSz);
        svg.setAttribute('height', mSz);
        svg.setAttribute('viewBox', `0 0 ${mSz} ${mSz}`);

        const t = opts.markerType || 'rounded-square';
        const col = 'var(--color-ink)';
        const pad = mSz * (opts.markerPadding || 0.22);
        const side = mSz - pad*2;

        if (t === 'rounded-square') {
          const rect = document.createElementNS(ns,'rect');
          rect.setAttribute('x', pad);
          rect.setAttribute('y', pad);
          rect.setAttribute('width', side);
          rect.setAttribute('height', side);
          rect.setAttribute('rx', opts.markerRx ?? 4);
          rect.setAttribute('fill', col);
          svg.appendChild(rect);
        } else if (t === 'outlined-square') {
          const rect = document.createElementNS(ns,'rect');
          rect.setAttribute('x', pad);
          rect.setAttribute('y', pad);
          rect.setAttribute('width', side);
          rect.setAttribute('height', side);
          rect.setAttribute('rx', opts.markerRx ?? 4);
          rect.setAttribute('fill', 'none');
          rect.setAttribute('stroke', col);
          rect.setAttribute('stroke-width', opts.markerStrokeWidth || 2.5);
          svg.appendChild(rect);
        } else if (t === 'shadow-square') {
          const sh = document.createElementNS(ns,'rect');
          sh.setAttribute('x', pad);
          sh.setAttribute('y', pad+1.5);
          sh.setAttribute('width', side);
          sh.setAttribute('height', side);
          sh.setAttribute('rx', opts.markerRx ?? 4);
          sh.setAttribute('fill', 'rgba(0,0,0,0.18)');
          svg.appendChild(sh);
          const rect = document.createElementNS(ns,'rect');
          rect.setAttribute('x', pad);
          rect.setAttribute('y', pad);
          rect.setAttribute('width', side);
          rect.setAttribute('height', side);
          rect.setAttribute('rx', opts.markerRx ?? 4);
          rect.setAttribute('fill', col);
          svg.appendChild(rect);
        } else if (t === 'tight-square') {
          const p2 = mSz * 0.18;
          const s2 = mSz - p2*2;
          const rect = document.createElementNS(ns,'rect');
          rect.setAttribute('x', p2);
          rect.setAttribute('y', p2);
          rect.setAttribute('width', s2);
          rect.setAttribute('height', s2);
          rect.setAttribute('rx', opts.markerRx ?? 3);
          rect.setAttribute('fill', col);
          svg.appendChild(rect);
        } else if (t === 'sharp-square') {
          const rect = document.createElementNS(ns,'rect');
          rect.setAttribute('x', pad);
          rect.setAttribute('y', pad);
          rect.setAttribute('width', side);
          rect.setAttribute('height', side);
          rect.setAttribute('rx', 0);
          rect.setAttribute('fill', col);
          svg.appendChild(rect);
        } else if (t === 'round-square') {
          const rect = document.createElementNS(ns,'rect');
          rect.setAttribute('x', pad);
          rect.setAttribute('y', pad);
          rect.setAttribute('width', side);
          rect.setAttribute('height', side);
          rect.setAttribute('rx', opts.markerRx ?? 8);
          rect.setAttribute('fill', col);
          svg.appendChild(rect);
        }
        cell.appendChild(svg);
      }

      if (isE) {
        const svg = document.createElementNS(ns,'svg');
        svg.setAttribute('width', mSz);
        svg.setAttribute('height', mSz);
        svg.setAttribute('viewBox', `0 0 ${mSz} ${mSz}`);

        const et = opts.exclusionType || 'dot';
        const ec = opts.exclusionColor || 'var(--color-ink)';

        if (et === 'dot') {
          const dot = document.createElementNS(ns,'circle');
          dot.setAttribute('cx', mSz/2);
          dot.setAttribute('cy', mSz/2);
          dot.setAttribute('r', mSz * (opts.exclusionDotScale || 0.08));
          dot.setAttribute('fill', ec);
          svg.appendChild(dot);
        } else if (et === 'medium-dot') {
          const dot = document.createElementNS(ns,'circle');
          dot.setAttribute('cx', mSz/2);
          dot.setAttribute('cy', mSz/2);
          dot.setAttribute('r', mSz * 0.12);
          dot.setAttribute('fill', ec);
          svg.appendChild(dot);
        } else if (et === 'ring') {
          const ring = document.createElementNS(ns,'circle');
          ring.setAttribute('cx', mSz/2);
          ring.setAttribute('cy', mSz/2);
          ring.setAttribute('r', mSz * 0.1);
          ring.setAttribute('fill', 'none');
          ring.setAttribute('stroke', ec);
          ring.setAttribute('stroke-width', 1.5);
          svg.appendChild(ring);
        } else if (et === 'small-cross') {
          const p = mSz * 0.35;
          [[p,p,mSz-p,mSz-p],[mSz-p,p,p,mSz-p]].forEach(([x1,y1,x2,y2]) => {
            const l = document.createElementNS(ns,'line');
            l.setAttribute('x1',x1); l.setAttribute('y1',y1);
            l.setAttribute('x2',x2); l.setAttribute('y2',y2);
            l.setAttribute('stroke', ec);
            l.setAttribute('stroke-width', 1.5);
            l.setAttribute('stroke-linecap', 'round');
            svg.appendChild(l);
          });
        } else if (et === 'dash') {
          const l = document.createElementNS(ns,'line');
          l.setAttribute('x1', mSz*0.3);
          l.setAttribute('y1', mSz/2);
          l.setAttribute('x2', mSz*0.7);
          l.setAttribute('y2', mSz/2);
          l.setAttribute('stroke', ec);
          l.setAttribute('stroke-width', 2);
          l.setAttribute('stroke-linecap', 'round');
          svg.appendChild(l);
        }
        cell.appendChild(svg);
      }

      el.appendChild(cell);
    }
  }
}

function buildSection(rowId, options) {
  const row = document.getElementById(rowId);
  row.innerHTML = '';
  options.forEach(o => {
    const opt = document.createElement('div');
    opt.className = 'grid-option';
    opt.innerHTML = `<div class="option-label">${o.label}</div><div class="grid-wrapper"><div id="${o.id}"></div></div>`;
    row.appendChild(opt);
    buildGrid(o.id, o);
  });
}

function buildAll() {
  buildSection('markers-row', [
    { id:'m-a', label:'A: Rounded square (default)', markerType:'rounded-square', markerRx:4 },
    { id:'m-b', label:'B: More rounded', markerType:'rounded-square', markerRx:8 },
    { id:'m-c', label:'C: Sharp square', markerType:'sharp-square' },
    { id:'m-d', label:'D: Tighter fit', markerType:'tight-square', markerRx:3 },
    { id:'m-e', label:'E: With shadow', markerType:'shadow-square', markerRx:4 },
    { id:'m-f', label:'F: Outlined', markerType:'outlined-square', markerRx:4, markerStrokeWidth:2.5 },
  ]);

  buildSection('exclusions-row', [
    { id:'e-a', label:'A: Dot, ink (default)', exclusionType:'dot', exclusionColor:'var(--color-ink)', markerType:'rounded-square' },
    { id:'e-b', label:'B: Medium dot, ink', exclusionType:'medium-dot', exclusionColor:'var(--color-ink)', markerType:'rounded-square' },
    { id:'e-c', label:'C: Dot, body', exclusionType:'dot', exclusionColor:'var(--color-body)', markerType:'rounded-square' },
    { id:'e-d', label:'D: Ring', exclusionType:'ring', exclusionColor:'var(--color-ink)', markerType:'rounded-square' },
    { id:'e-e', label:'E: Small cross', exclusionType:'small-cross', exclusionColor:'var(--color-ink)', markerType:'rounded-square' },
    { id:'e-f', label:'F: Dash', exclusionType:'dash', exclusionColor:'var(--color-ink)', markerType:'rounded-square' },
  ]);

  buildSection('drag-row', [
    { id:'d-a', label:'A: Darken 30% (default)', dragHighlight:'darken', markerType:'rounded-square', exclusionType:'dot', exclusionColor:'var(--color-ink)' },
    { id:'d-b', label:'B: Lighten 30%', dragHighlight:'lighten', markerType:'rounded-square', exclusionType:'dot', exclusionColor:'var(--color-ink)' },
    { id:'d-c', label:'C: Inset border', dragHighlight:'border-only', markerType:'rounded-square', exclusionType:'dot', exclusionColor:'var(--color-ink)' },
    { id:'d-d', label:'D: Desaturate', dragHighlight:'desaturate', markerType:'rounded-square', exclusionType:'dot', exclusionColor:'var(--color-ink)' },
    { id:'d-e', label:'E: Accent tint', dragHighlight:'accent-tint', markerType:'rounded-square', exclusionType:'dot', exclusionColor:'var(--color-ink)' },
  ]);
}

window.addEventListener('DOMContentLoaded', buildAll);
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(buildAll, 150);
});
</script>
</head>
<body>
<h1>Reign — Style Preview</h1>
<p class="subtitle">Swipe to compare. Defaults are option A.</p>

<h2>Marker Shape</h2>
<div class="grid-row" id="markers-row"></div>

<h2>Exclusion Marks</h2>
<div class="grid-row" id="exclusions-row"></div>

<h2>Drag Highlight</h2>
<p class="subtitle" style="margin-bottom:4px">Bottom-right cells show the drag highlight</p>
<div class="grid-row" id="drag-row"></div>
</body>
</html>
