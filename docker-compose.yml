services:
  localstack:
    # Pinned to a stable release. Using `latest` once pulled a
    # 2026.3.1.dev4973 build whose SQS SendMessage was broken
    # (returned 500 InternalError with an empty exception body in
    # the logs — a LocalStack regression that took an hour to
    # diagnose). Bump intentionally; never auto-pull.
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sqs
      - DEFAULT_REGION=us-east-1
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_TOKEN}
      # Persist DynamoDB/SQS state across container restarts. Without
      # this, LocalStack runs purely in-memory and every `task dev:down`
      # or `docker compose restart` wipes the puzzle pool. Pro feature
      # enabled by LOCALSTACK_AUTH_TOKEN.
      - PERSISTENCE=1
    volumes:
      # `./.localstack` resolves relative to compose's cwd. When `docker compose`
      # is invoked from inside the devcontainer, that cwd is `/workspaces/...`,
      # which Docker Desktop's daemon can't find on the host filesystem (the
      # repo lives at `/Users/.../reign-game`). HOST_REPO_PATH is set by the
      # devcontainer (devcontainer.json containerEnv → ${localWorkspaceFolder})
      # to the host-side absolute path; when unset (host shell), `.` keeps the
      # original behavior.
      - ${HOST_REPO_PATH:-.}/.localstack:/etc/localstack/init/ready.d
      - localstack-data:/var/lib/localstack

volumes:
  localstack-data:
