version: "3"

# LocalStack endpoint vars (host vs devcontainer divergence).
#
# On the host, LocalStack is reachable on the published port at 127.0.0.1:4566
# and the SQS magic hostname `sqs.us-east-1.localhost.localstack.cloud:4566`
# (which resolves to 127.0.0.1 via a public DNS A record).
#
# Inside the devcontainer, neither works: 127.0.0.1 is the dev container's own
# loopback and `localhost.localstack.cloud` resolves to that same 127.0.0.1.
# LocalStack is reachable at the docker-network DNS name `localstack:4566`.
#
# devcontainer.json::containerEnv sets LOCALSTACK_URL and SQS_QUEUE_HOST to the
# `localstack:4566` form inside the container; on the host they're unset and
# the defaults below apply.
vars:
  LOCALSTACK_URL:
    sh: echo "${LOCALSTACK_URL:-http://127.0.0.1:4566}"
  SQS_QUEUE_HOST:
    sh: echo "${SQS_QUEUE_HOST:-http://sqs.us-east-1.localhost.localstack.cloud:4566}"

# Shell pitfalls (read before editing process-lifecycle cmds).
#
# Task runs `cmds:` in its built-in interpreter (mvdan.cc/sh), not bash. It
# mostly matches POSIX but diverges where it bites process-lifecycle code:
#   - `$!` after a background job returns a goroutine handle, not an OS PID —
#     capturing it stores garbage.
#   - `kill -0` against external OS PIDs is unreliable.
#   - `disown` is unimplemented.
#   - `set -e` around command substitution differs from bash.
# When a task tracks a backgrounded process by PID (anything without a port),
# wrap the block in a bash heredoc:
#   cmds:
#     - |
#       bash <<'BASH'
#       set -e
#       nohup long-running-cmd > log 2>&1 </dev/null &
#       echo $! > pid
#       BASH
# Port-based lifecycle (`lsof -ti:PORT`) works fine in Task's shell and is
# preferred whenever a port exists.

tasks:
  build:backend:
    desc: Build the Go backend
    dir: backend
    cmds:
      - go build ./...

  build:lambda:
    desc: Build the reproducible Lambda zips into backend/build/ (cmd/api → backend/build/lambda.zip, cmd/daily-cron → backend/build/daily-cron.zip). Same recipe in CI and CD so terraform plan stays clean across PRs. The shared bootstrap binary is overwritten between the two builds; each zip captures the right binary at its zip step.
    dir: backend
    cmds:
      - mkdir -p build
      # cmd/api → backend/build/lambda.zip
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o build/bootstrap ./cmd/api
      - touch -t 200001010000.00 build/bootstrap
      - zip -jX build/lambda.zip build/bootstrap
      # cmd/daily-cron → backend/build/daily-cron.zip (overwrites build/bootstrap)
      - GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags="-s -w" -o build/bootstrap ./cmd/daily-cron
      - touch -t 200001010000.00 build/bootstrap
      - zip -jX build/daily-cron.zip build/bootstrap

  test:backend:
    desc: Run backend tests (-short matches pre-push + ci.yml; long generator
      tests are testing.Short()-guarded and run via
      .github/workflows/generator-check.yml with -tags=soak and a 40-min timeout)
    dir: backend
    cmds:
      - go test -short ./... -v

  lint:backend:
    desc: Run backend linter
    dir: backend
    cmds:
      - golangci-lint run

  bench:backend:
    desc: Run the full generator benchmark suite (R-068a) — writes results to stdout
    dir: backend
    cmds:
      - go test -bench=. -benchmem -benchtime=3x -timeout=30m -run='^$' ./internal/generator/

  bench:backend:baseline:
    desc: Re-run benches and overwrite bench/baseline.txt (R-068a baseline snapshot)
    dir: backend
    cmds:
      - go test -bench=. -benchmem -benchtime=3x -timeout=30m -run='^$' ./internal/generator/ | tee internal/generator/bench/baseline.txt

  bench:backend:latency:
    desc: Refresh bench/latency-distribution.md (R-068a) — requires REIGN_BENCH_WRITE=1
    dir: backend
    cmds:
      - REIGN_BENCH_WRITE=1 go test -tags=latency -run TestLatencyDistribution -v -timeout=60m ./internal/generator/

  bench:backend:distribution:
    desc: Refresh bench/difficulty-distribution.md (R-068d) — 1h per bucket by default; override with REIGN_DIST_BUDGET_SEC
    dir: backend
    cmds:
      - REIGN_BENCH_WRITE=1 go test -tags=distribution -run TestDifficultyDistribution -v -timeout=8h ./internal/generator/

  bench:backend:soak:
    desc: Long-running soak + property suite (R-068b) — invoked by generator-check.yml
    dir: backend
    cmds:
      - go test -tags=soak -timeout=30m ./internal/generator/...

  reproduce:
    desc: "Regenerate a puzzle from seed+N+k. Usage: task reproduce -- --seed=X --n=9 --k=1"
    dir: backend
    cmds:
      - go run ./cmd/reproduce {{.CLI_ARGS}}

  dev:localstack:
    desc: Start LocalStack (DynamoDB + SQS)
    cmds:
      - docker compose up localstack

  dev:backend:
    desc: Start backend dev server with LocalStack endpoints
    dir: backend
    # Load dev secrets (e.g. CLERK_SECRET_KEY) from backend/.env.local.
    # The file is gitignored; copy .env.local.example to bootstrap it.
    # dotenv variables are available to the child `go run` process.
    dotenv: ['.env.local']
    env:
      DYNAMODB_ENDPOINT: '{{.LOCALSTACK_URL}}'
      SQS_ENDPOINT: '{{.LOCALSTACK_URL}}'
      SQS_QUEUE_URL: '{{.SQS_QUEUE_HOST}}/000000000000/puzzle-generation'
      AWS_REGION: us-east-1
      PUZZLE_TABLE_NAME: puzzle-pool
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    cmds:
      - go run ./cmd/api

  dev:generator:
    desc: Start SQS consumer with LocalStack env vars
    dir: backend
    env:
      GENERATOR_MODE: sqs
      DYNAMODB_ENDPOINT: '{{.LOCALSTACK_URL}}'
      SQS_ENDPOINT: '{{.LOCALSTACK_URL}}'
      SQS_QUEUE_URL: '{{.SQS_QUEUE_HOST}}/000000000000/puzzle-generation'
      AWS_REGION: us-east-1
      PUZZLE_TABLE_NAME: puzzle-pool
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    cmds:
      - go run ./cmd/api

  build:frontend:
    desc: Build the frontend
    dir: frontend
    cmds:
      - npm run build

  test:frontend:
    desc: Run frontend tests
    dir: frontend
    cmds:
      - npm test

  test:e2e:
    desc: Run the Playwright e2e project against the locally-running e2e stack. Loads Clerk creds from frontend/.env.local + backend/.env.local. Assumes `task e2e:up` already ran.
    # dotenv paths resolve relative to `dir:`, NOT the Taskfile's location.
    # With `dir: frontend`, the frontend env-file is `.env.local` and the
    # backend's is `../backend/.env.local`. (Other tasks in this file follow
    # the same convention — see e.g. dev:up:backend's `dotenv: ['.env.local']`
    # paired with `dir: backend`.)
    dotenv: ['.env.local', '../backend/.env.local']
    dir: frontend
    cmds:
      - npm run test:e2e

  test:integration:
    desc: Run the Playwright integration project (mocked APIs, no backend stack).
    # Playwright's global-setup.ts requires VITE_CLERK_PUBLISHABLE_KEY even
    # though the integration project mocks /api/* — the bundled frontend
    # still imports Clerk and won't boot without a publishable key. Loads
    # from the same files as test:e2e so the user doesn't need to export
    # anything to invoke the task.
    dotenv: ['.env.local', '../backend/.env.local']
    dir: frontend
    cmds:
      - npm run test:integration

  dev:frontend:
    desc: Start frontend dev server (port 5180, network accessible)
    dir: frontend
    cmds:
      - npm run dev -- --host 0.0.0.0

  build:
    desc: Build backend and frontend
    deps:
      - build:backend
      - build:frontend

  test:
    desc: Run all tests
    deps:
      - test:backend
      - test:frontend

  deploy:
    desc: Deploy infrastructure via Terraform
    deps:
      - build
    dir: infra
    cmds:
      - terraform apply

  # ---------------------------------------------------------------------------
  # Dev lifecycle (STANDARD — use these to start/stop the stack during testing).
  # Logs stream to ./logs/{backend,generator,frontend}.log (gitignored).
  #
  # Process tracking strategy differs per service:
  #   - frontend (:5180): port-based via `lsof -ti:PORT`. This is ground
  #     truth — whatever is listening on the port owns it. Catches orphans
  #     from prior runs, handles processes started outside `task dev:up`,
  #     and doesn't go stale.
  #   - backend (:5181) + e2e backend (:5182): port-based via `lsof`
  #     PLUS PID file (logs/{dev,e2e}-backend.pid). The PID file pins the
  #     `go run` wrapper so the orphan preflight can disambiguate dev's
  #     api binary from e2e's when both stacks are up (see GH #161). The
  #     port stays the authoritative lifecycle signal for `dev:down:*`.
  #   - generator + e2e generator (no port): PID file only
  #     (logs/{generator,e2e-generator}.pid), because there's nothing to
  #     probe. Trade-off: only tracks processes we started; stale PID
  #     files are detected via `kill -0` and cleaned up.
  # ---------------------------------------------------------------------------

  dev:up:localstack:
    desc: Start LocalStack container (DynamoDB + SQS) and wait for ready
    cmds:
      - docker compose up -d localstack
      - |
        echo "waiting for LocalStack on {{.LOCALSTACK_URL}}..."
        for i in $(seq 1 60); do
          if curl -sf {{.LOCALSTACK_URL}}/_localstack/health >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done
        # Wait for init-aws.sh to finish: the puzzle-generation queue must exist
        # and the puzzle-pool DynamoDB table must be ACTIVE. LocalStack health
        # returns ready before init scripts complete.
        echo "waiting for init (puzzle-generation queue + puzzle-pool table)..."
        for i in $(seq 1 60); do
          q_ok=n
          if docker compose exec -T localstack awslocal sqs get-queue-url --queue-name puzzle-generation >/dev/null 2>&1; then
            q_ok=y
          fi
          t_ok=$(docker compose exec -T localstack awslocal dynamodb describe-table --table-name puzzle-pool --query 'Table.TableStatus' --output text 2>/dev/null || true)
          if [ "$q_ok" = "y" ] && [ "$t_ok" = "ACTIVE" ]; then
            echo "LocalStack ready (queue + table provisioned)"
            exit 0
          fi
          sleep 1
        done
        echo "LocalStack init did not finish in 60s — check: docker compose logs localstack"
        exit 1

  _dev:preflight:orphans:
    desc: Internal — fail if an orphan cmd/api binary is running
    internal: true
    cmds:
      - |
        bash <<'BASH'
        set -e
        # Refuse to start the stack if an orphan cmd/api binary is
        # around from an earlier session (see CLAUDE.md — the mvdan/sh
        # shell has historically reported "stopped" without actually
        # killing; see KI-021). An orphan can happily poll SQS against
        # a pre-rule binary and produce puzzles that violate R-067b.
        # Rather than silently adding another instance, tell the human
        # and bail.
        #
        # Expected process set when the stack is healthy:
        #   dev backend       wrapper PID in logs/dev-backend.pid (and child api binary)
        #   e2e backend       wrapper PID in logs/e2e-backend.pid (and child api binary)
        #   dev generator     wrapper PID in logs/generator.pid     (and child api binary)
        #   e2e generator     wrapper PID in logs/e2e-generator.pid (and child api binary)
        # Anything else running the api binary is an orphan.
        #
        # The pgrep pattern matches both the Go toolchain's go-build
        # cache and JetBrains GoLand's ___go_build_* builds so an IDE-
        # launched dev instance is detected too.
        #
        # Exclusion set is built from:
        #   1. Port listeners on :5181 / :5182 (belt-and-suspenders — covers
        #      the case where a PID file was deleted out from under us).
        #   2. Every *-backend.pid / *generator.pid file's wrapper PID
        #      plus the wrapper's `/api$` children. This is the
        #      authoritative signal: a process whose PID is in one of
        #      our files (and still alive) is a legitimate service, not
        #      an orphan — even if it lost its port binding or hasn't
        #      bound one yet (see GH #161).
        exclude_pids=""
        add_exclude() {
          # Append space-separated PIDs to the exclusion list. The
          # `return 0` is required under `set -e`: when a caller passes
          # an empty arg (e.g. lsof returned nothing), the `[ -n ]` test
          # in the loop becomes the function's last command and returns
          # nonzero, which would otherwise abort the script.
          for p in "$@"; do
            [ -n "$p" ] && exclude_pids="$exclude_pids $p"
          done
          return 0
        }
        # NB: command substitutions below are intentionally unquoted so
        # word-splitting at the call site delivers each PID as a separate
        # argument to add_exclude (instead of one newline-joined blob).
        # PIDs are integers, so no shell-metachar safety concern.
        for port in 5181 5182; do
          add_exclude $(lsof -ti:"$port" -sTCP:LISTEN 2>/dev/null || true)
        done
        for pidfile in logs/dev-backend.pid logs/e2e-backend.pid logs/generator.pid logs/e2e-generator.pid; do
          [ -f "$pidfile" ] || continue
          wrapper=$(cat "$pidfile" 2>/dev/null || true)
          [ -n "$wrapper" ] || continue
          kill -0 "$wrapper" 2>/dev/null || continue  # stale PID file → ignore
          add_exclude "$wrapper"
          add_exclude $(pgrep -P "$wrapper" -f '/api$' 2>/dev/null || true)
        done
        orphans=""
        for pid in $(pgrep -f '(go-build|___go_build).*/api$' 2>/dev/null || true); do
          excluded=0
          for ex in $exclude_pids; do
            if [ "$pid" = "$ex" ]; then
              excluded=1
              break
            fi
          done
          [ $excluded -eq 0 ] && orphans="$orphans $pid"
        done
        if [ -n "$orphans" ]; then
          echo "ERROR: orphan cmd/api process(es) detected — dev:down:* left them behind." >&2
          for pid in $orphans; do
            ps -p "$pid" -o pid,etime,command 2>/dev/null | tail -1 >&2
          done
          echo "" >&2
          echo "These are likely running outdated code. Kill and retry:" >&2
          echo "  kill -9$orphans && task dev:up" >&2
          exit 1
        fi
        BASH

  dev:up:backend:
    desc: Start backend in background (logs -> logs/backend.log)
    deps:
      - dev:up:localstack
      - _dev:preflight:orphans
    dir: backend
    # Load dev secrets (e.g. CLERK_SECRET_KEY) from backend/.env.local.
    # See backend/.env.local.example for the template. Missing file is
    # fine for tests but backend/cmd/api will log.Fatal at startup if
    # no Clerk secret is resolvable from env or SSM.
    dotenv: ['.env.local']
    env:
      DYNAMODB_ENDPOINT: '{{.LOCALSTACK_URL}}'
      SQS_ENDPOINT: '{{.LOCALSTACK_URL}}'
      SQS_QUEUE_URL: '{{.SQS_QUEUE_HOST}}/000000000000/puzzle-generation'
      AWS_REGION: us-east-1
      PUZZLE_TABLE_NAME: puzzle-pool
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    cmds:
      - mkdir -p ../logs
      - |
        bash <<'BASH'
        source "$(git rev-parse --show-toplevel)/scripts/dev/lib.sh"
        start_port_service backend 5181 'go run ./cmd/api' ../logs/backend.log \
          --health-url http://localhost:5181/api/health \
          --pid-file ../logs/dev-backend.pid \
          --timeout 60
        BASH

  dev:up:generator:
    desc: Start SQS generator worker in background (logs -> logs/generator.log)
    deps:
      - dev:up:localstack
      - _dev:preflight:orphans
    dir: backend
    env:
      GENERATOR_MODE: sqs
      DYNAMODB_ENDPOINT: '{{.LOCALSTACK_URL}}'
      SQS_ENDPOINT: '{{.LOCALSTACK_URL}}'
      SQS_QUEUE_URL: '{{.SQS_QUEUE_HOST}}/000000000000/puzzle-generation'
      AWS_REGION: us-east-1
      PUZZLE_TABLE_NAME: puzzle-pool
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    cmds:
      - mkdir -p ../logs
      - |
        bash <<'BASH'
        source "$(git rev-parse --show-toplevel)/scripts/dev/lib.sh"
        start_pid_service generator 'go run ./cmd/api' ../logs/generator.log \
          ../logs/generator.pid \
          --ready-grep 'starting local SQS poller' \
          --timeout 30
        BASH

  dev:up:frontend:
    desc: Start frontend in background (logs -> logs/frontend.log)
    dir: frontend
    cmds:
      - mkdir -p ../logs
      - |
        bash <<'BASH'
        source "$(git rev-parse --show-toplevel)/scripts/dev/lib.sh"
        start_port_service frontend 5180 'npm run dev -- --host 0.0.0.0' ../logs/frontend.log \
          --timeout 60
        BASH

  dev:up:
    desc: Start LocalStack + backend + generator + frontend (standard dev stack)
    cmds:
      - task: dev:up:backend
      - task: dev:up:generator
      - task: dev:up:frontend
      - |
        echo ""
        echo "All services up:"
        echo "  frontend:  http://localhost:5180/"
        echo "  backend:   http://localhost:5181/ (health: /api/health)"
        echo "  admin:     http://localhost:5180/admin"
        echo "  generator: PID $(cat logs/generator.pid 2>/dev/null || echo ?)"
        echo "  logs:      task dev:logs   (or dev:logs:{backend,generator,frontend})"
        echo "  status:    task dev:status"
        echo "  stop:      task dev:down"

  dev:down:backend:
    desc: Stop the backend (kills whatever is on :5181). Verifies the port is free before returning success.
    cmds:
      - |
        bash <<'BASH'
        source "$(git rev-parse --show-toplevel)/scripts/dev/lib.sh"
        stop_port_service backend 5181 --pid-file logs/dev-backend.pid
        BASH

  dev:down:frontend:
    desc: Stop the frontend (kills whatever is on :5180). Verifies the port is free before returning success.
    cmds:
      - |
        bash <<'BASH'
        source "$(git rev-parse --show-toplevel)/scripts/dev/lib.sh"
        stop_port_service frontend 5180
        BASH

  dev:down:generator:
    desc: Stop the generator worker. Verifies the PID is gone before returning success.
    cmds:
      - |
        bash <<'BASH'
        source "$(git rev-parse --show-toplevel)/scripts/dev/lib.sh"
        stop_pid_service generator logs/generator.pid
        BASH

  dev:down:localstack:
    desc: Stop LocalStack container
    cmds:
      - docker compose stop localstack

  dev:down:
    desc: Stop all dev services (frontend, generator, backend, LocalStack)
    cmds:
      - task: dev:down:frontend
      - task: dev:down:generator
      - task: dev:down:backend
      - task: dev:down:localstack

  dev:restart:
    desc: Restart the full dev stack
    cmds:
      - task: dev:down
      - task: dev:up

  dev:restart:backend:
    desc: Restart only the backend (picks up Go source changes)
    cmds:
      - task: dev:down:backend
      - task: dev:up:backend

  dev:restart:frontend:
    desc: Restart only the frontend
    cmds:
      - task: dev:down:frontend
      - task: dev:up:frontend

  dev:restart:generator:
    desc: Restart only the generator worker
    cmds:
      - task: dev:down:generator
      - task: dev:up:generator

  dev:logs:
    desc: Stream backend + generator + frontend logs to stdout (Ctrl+C to stop)
    cmds:
      - mkdir -p logs
      - touch logs/backend.log logs/generator.log logs/frontend.log
      - tail -n 100 -F logs/backend.log logs/generator.log logs/frontend.log

  dev:logs:backend:
    desc: Stream backend logs to stdout
    cmds:
      - mkdir -p logs
      - touch logs/backend.log
      - tail -n 200 -F logs/backend.log

  dev:logs:frontend:
    desc: Stream frontend logs to stdout
    cmds:
      - mkdir -p logs
      - touch logs/frontend.log
      - tail -n 200 -F logs/frontend.log

  dev:logs:generator:
    desc: Stream generator logs to stdout
    cmds:
      - mkdir -p logs
      - touch logs/generator.log
      - tail -n 200 -F logs/generator.log

  dev:status:
    desc: Show status of dev services
    cmds:
      - |
        bash <<'BASH'
        check_port() {
          local name=$1 port=$2
          local pid
          pid=$(lsof -ti:$port -sTCP:LISTEN 2>/dev/null || true)
          if [ -n "$pid" ]; then
            echo "$name: running (PID $pid, port $port)"
          else
            echo "$name: stopped (port $port)"
          fi
        }
        check_port backend  5181
        check_port frontend 5180
        if [ -f logs/generator.pid ] && kill -0 "$(cat logs/generator.pid)" 2>/dev/null; then
          echo "generator: running (PID $(cat logs/generator.pid))"
        else
          echo "generator: stopped"
        fi
        if docker compose ps --services --filter status=running 2>/dev/null | grep -qx localstack; then
          echo "localstack: running"
        else
          echo "localstack: stopped"
        fi
        BASH

  # ---------------------------------------------------------------------------
  # E2E lifecycle (R-06B). A second backend on :5182 reads puzzle-pool-e2e
  # so Playwright's e2e project can play against a fixed fixture set without
  # touching the dev pool. No generator worker — fixtures are pre-seeded.
  # ---------------------------------------------------------------------------

  e2e:up:backend:
    desc: Start e2e backend on :5182 reading puzzle-pool-e2e
    deps:
      - dev:up:localstack
      - _dev:preflight:orphans
    dir: backend
    # Shares backend/.env.local with the dev backend so the e2e stack
    # picks up the same Clerk dev secret.
    dotenv: ['.env.local']
    env:
      PORT: "5182"
      DYNAMODB_ENDPOINT: '{{.LOCALSTACK_URL}}'
      SQS_ENDPOINT: '{{.LOCALSTACK_URL}}'
      # Publish replenish messages to the e2e queue so e2e:up:generator
      # (which polls puzzle-generation-e2e) can pick them up. Using the
      # dev `puzzle-generation` queue here would route messages to the
      # dev generator and starve the e2e generator — silent test break.
      SQS_QUEUE_URL: '{{.SQS_QUEUE_HOST}}/000000000000/puzzle-generation-e2e'
      AWS_REGION: us-east-1
      PUZZLE_TABLE_NAME: puzzle-pool-e2e
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    cmds:
      - mkdir -p ../logs
      - |
        bash <<'BASH'
        source "$(git rev-parse --show-toplevel)/scripts/dev/lib.sh"
        start_port_service "e2e backend" 5182 'go run ./cmd/api' ../logs/e2e-backend.log \
          --health-url http://localhost:5182/api/health \
          --pid-file ../logs/e2e-backend.pid \
          --timeout 60
        BASH

  e2e:down:backend:
    desc: Stop the e2e backend. Verifies the port is free before returning success.
    cmds:
      - |
        bash <<'BASH'
        source "$(git rev-parse --show-toplevel)/scripts/dev/lib.sh"
        stop_port_service "e2e backend" 5182 --pid-file logs/e2e-backend.pid
        BASH

  e2e:up:generator:
    desc: Start the e2e SQS generator worker (logs -> logs/e2e-generator.log, PID -> logs/e2e-generator.pid)
    deps:
      - dev:up:localstack
      - _dev:preflight:orphans
    dir: backend
    env:
      GENERATOR_MODE: sqs
      DYNAMODB_ENDPOINT: '{{.LOCALSTACK_URL}}'
      SQS_ENDPOINT: '{{.LOCALSTACK_URL}}'
      SQS_QUEUE_URL: '{{.SQS_QUEUE_HOST}}/000000000000/puzzle-generation-e2e'
      AWS_REGION: us-east-1
      PUZZLE_TABLE_NAME: puzzle-pool-e2e
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    cmds:
      - mkdir -p ../logs
      - |
        bash <<'BASH'
        source "$(git rev-parse --show-toplevel)/scripts/dev/lib.sh"
        start_pid_service "e2e generator" 'go run ./cmd/api' ../logs/e2e-generator.log \
          ../logs/e2e-generator.pid \
          --ready-grep 'starting local SQS poller' \
          --timeout 30
        BASH

  e2e:down:generator:
    desc: Stop the e2e generator worker. Verifies the PID is gone before returning success.
    cmds:
      - |
        bash <<'BASH'
        source "$(git rev-parse --show-toplevel)/scripts/dev/lib.sh"
        stop_pid_service "e2e generator" logs/e2e-generator.pid
        BASH

  e2e:up:frontend:
    desc: Start a second Vite on :5183 that proxies /api/* to the e2e backend at :5182
    dir: frontend
    env:
      REIGN_API_TARGET: http://localhost:5182
    cmds:
      - mkdir -p ../logs
      - |
        bash <<'BASH'
        source "$(git rev-parse --show-toplevel)/scripts/dev/lib.sh"
        start_port_service "e2e frontend" 5183 'npm run dev -- --port 5183 --host 0.0.0.0' ../logs/e2e-frontend.log \
          --timeout 60
        BASH

  e2e:down:frontend:
    desc: Stop the e2e frontend. Verifies the port is free before returning success.
    cmds:
      - |
        bash <<'BASH'
        source "$(git rev-parse --show-toplevel)/scripts/dev/lib.sh"
        stop_port_service "e2e frontend" 5183
        BASH

  e2e:seed:
    desc: Load committed fixture puzzles into puzzle-pool-e2e. Idempotent — wipes non-CONFIG rows and re-inserts.
    deps:
      - dev:up:localstack
    cmds:
      - |
        bash <<'BASH'
        set -e
        fixture_dir=frontend/playwright/e2e/fixtures/puzzles
        if [ ! -d "$fixture_dir" ]; then
          echo "ERROR: fixture dir $fixture_dir does not exist." >&2
          echo "Run `go run ./backend/cmd/genfixtures` to generate fixtures." >&2
          exit 1
        fi
        # Puzzle fixtures are the *.json files that DON'T end in
        # .solution.json — those are sibling arrays of solution
        # positions consumed by the Playwright specs, not DynamoDB
        # items.
        shopt -s nullglob
        puzzle_files=()
        for f in "$fixture_dir"/*.json; do
          case "$f" in
            *.solution.json) continue ;;
            *) puzzle_files+=("$f") ;;
          esac
        done
        if [ ${#puzzle_files[@]} -eq 0 ]; then
          echo "ERROR: no puzzle fixture files in $fixture_dir." >&2
          exit 1
        fi

        echo "flushing puzzle-pool-e2e..."
        TABLE_NAME=puzzle-pool-e2e AWS_ENDPOINT_URL={{.LOCALSTACK_URL}} \
          AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test AWS_REGION=us-east-1 \
          CONFIRM=YES ./scripts/flush-pool.sh

        echo "seeding ${#puzzle_files[@]} fixture(s) into puzzle-pool-e2e..."
        for f in "${puzzle_files[@]}"; do
          docker compose exec -T localstack awslocal dynamodb put-item \
            --table-name puzzle-pool-e2e \
            --item "file:///dev/stdin" < "$f" >/dev/null 2>&1 || {
              echo "  FAIL: $f" >&2
              exit 1
            }
          echo "  seeded $(basename "$f")"
        done

        # Seed a DAILY-CANDIDATE row pointing at the daily-eligible
        # 9_standard fixture (seed=11). The e2e environment has no cron
        # Lambda, so the daily endpoint relies on the sync-fallback path
        # which can only confirm an existing candidate or recycle
        # yesterday's schedule — it does not pull from the approved pool.
        # Without this row a fresh e2e stack returns 500
        # (ErrPoolExhausted) on the first daily GET.
        echo "seeding DAILY-CANDIDATE row pointing at the daily-eligible fixture..."
        docker compose exec -T localstack awslocal dynamodb put-item \
          --table-name puzzle-pool-e2e \
          --item '{
            "PK": {"S": "DAILY-CANDIDATE"},
            "SK": {"S": "<single>"},
            "puzzleId": {"S": "e2e0000-0000-4000-9000-000000000001"},
            "queuedAt": {"S": "2026-01-01T00:00:00Z"},
            "sourcePartition": {"S": "9#standard"}
          }' >/dev/null 2>&1 || {
            echo "  FAIL: seeding DAILY-CANDIDATE" >&2
            exit 1
          }
        echo "  seeded DAILY-CANDIDATE -> e2e0000-0000-4000-9000-000000000001"

        echo "e2e fixtures ready."
        BASH

  e2e:up:
    desc: Start the full e2e stack (LocalStack + e2e backend + e2e generator + e2e frontend + fixtures)
    cmds:
      - task: e2e:up:backend
      - task: e2e:up:generator
      - task: e2e:up:frontend
      - task: e2e:seed
      - |
        # Warm the backend's first-DynamoDB-call path. Cold-start the
        # LocalStack DynamoDB client can take 5+ seconds (KI-022),
        # which trips the Playwright 5 s default on the first test.
        # /api/config/modes is read-only so the warmup doesn't mutate
        # fixture state.
        echo "warming e2e backend..."
        curl -sf http://localhost:5182/api/config/modes >/dev/null
      - |
        echo ""
        echo "E2E stack up:"
        echo "  e2e frontend: http://localhost:5183/ (proxies /api/* to :5182)"
        echo "  e2e backend:  http://localhost:5182/ (health: /api/health)"
        echo "  fixtures:     frontend/playwright/e2e/fixtures/puzzles/*.json"
        echo "  run tests:    task test:e2e   (or task e2e for up + test in one go)"
        echo "  stop:         task e2e:down"

  e2e:
    desc: "Single-shot: bring the e2e stack up if needed, run the e2e Playwright project, leave the stack up for the next run."
    cmds:
      - task: e2e:up
      - task: test:e2e

  e2e:down:
    desc: Stop the e2e frontend + generator + backend. LocalStack stays up (shared with dev).
    cmds:
      - task: e2e:down:frontend
      - task: e2e:down:generator
      - task: e2e:down:backend

  e2e:status:
    desc: Show e2e backend status + fixture count
    cmds:
      - |
        bash <<'BASH'
        pid=$(lsof -ti:5182 -sTCP:LISTEN 2>/dev/null || true)
        if [ -n "$pid" ]; then
          echo "e2e backend: running (PID $pid, port 5182)"
        else
          echo "e2e backend: stopped"
        fi
        if [ -d frontend/playwright/e2e/fixtures/puzzles ]; then
          count=$(ls -1 frontend/playwright/e2e/fixtures/puzzles/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "fixtures on disk: $count JSON file(s)"
        fi
        BASH

  e2e:genfixtures:
    desc: Regenerate committed fixture puzzles (deterministic from fixed seeds)
    dir: backend
    cmds:
      - go run ./cmd/genfixtures

  devcontainer:exec:
    desc: Open an interactive shell inside the dev container; brings the stack up first if it isn't already running.
    aliases: [dev]
    interactive: true
    cmds:
      - |
        DEVCONTAINER="$HOME/.devcontainers/bin/devcontainer"
        if [ ! -x "$DEVCONTAINER" ]; then
          DEVCONTAINER=$(command -v devcontainer 2>/dev/null || true)
        fi
        if [ -z "$DEVCONTAINER" ] || [ ! -x "$DEVCONTAINER" ]; then
          echo "ERROR: devcontainer CLI not found at ~/.devcontainers/bin/devcontainer or on PATH" >&2
          echo "       Install: https://github.com/devcontainers/cli" >&2
          exit 1
        fi
        if [ -z "$(docker ps --filter name=reign-game-dev-1 --filter status=running -q)" ]; then
          echo "Dev container not running — starting via devcontainer up..."
          "$DEVCONTAINER" up --workspace-folder .
        fi
        "$DEVCONTAINER" exec --workspace-folder . bash

  board:up-next:
    desc: 'Move a GitHub issue to a project-board Status (default "Up Next"), adding it to the board first if absent. Usage: task board:up-next ISSUE=<n> [STATUS="Up Next"]'
    vars:
      PROJECT_NUMBER: 1
      PROJECT_OWNER: lesteenman
      STATUS: '{{.STATUS | default "Up Next"}}'
    cmds:
      - |
        bash <<'BASH'
        set -euo pipefail

        issue="{{.ISSUE}}"
        owner="{{.PROJECT_OWNER}}"
        number="{{.PROJECT_NUMBER}}"
        status="{{.STATUS}}"

        if [ -z "$issue" ]; then
          echo "ISSUE is required — usage: task board:up-next ISSUE=<n>" >&2
          exit 1
        fi
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "GH_TOKEN is unset — set it in .devcontainer/.env.local (fine-grained PAT with Projects: read/write)." >&2
          exit 1
        fi

        # Project node id — required by `item-edit` (it takes the PVT_ id,
        # not the human-facing number).
        project_id=$(gh project view "$number" --owner "$owner" --format json | jq -r '.id')

        # Ensure the issue is on the board. `item-add` is idempotent: adding
        # an issue already on the board returns the existing item, not an error.
        gh project item-add "$number" --owner "$owner" \
          --url "https://github.com/$owner/reign-game/issues/$issue" >/dev/null

        # Resolve the board item id for this issue.
        item_id=$(gh project item-list "$number" --owner "$owner" --format json --limit 1000 \
          | jq -r --argjson n "$issue" '.items[] | select(.content.number == $n) | .id')
        if [ -z "$item_id" ]; then
          echo "could not resolve a board item for issue #$issue" >&2
          exit 1
        fi

        # Look up the Status field + target option ids at runtime — they
        # differ per project and change whenever the board is edited, so
        # they must never be hard-coded.
        fields=$(gh project field-list "$number" --owner "$owner" --format json)
        field_id=$(echo "$fields" | jq -r '.fields[] | select(.name == "Status") | .id')
        option_id=$(echo "$fields" \
          | jq -r --arg s "$status" '.fields[] | select(.name == "Status") | .options[] | select(.name == $s) | .id')
        if [ -z "$field_id" ] || [ -z "$option_id" ]; then
          echo "could not resolve the Status field or \"$status\" option on project #$number" >&2
          exit 1
        fi

        gh project item-edit --id "$item_id" --project-id "$project_id" \
          --field-id "$field_id" --single-select-option-id "$option_id" >/dev/null
        echo "moved issue #$issue to \"$status\""
        BASH
