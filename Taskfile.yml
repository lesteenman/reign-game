version: "3"

tasks:
  build:backend:
    desc: Build the Go backend
    dir: backend
    cmds:
      - go build ./...

  test:backend:
    desc: Run backend tests
    dir: backend
    cmds:
      - go test ./... -v

  lint:backend:
    desc: Run backend linter
    dir: backend
    cmds:
      - golangci-lint run

  bench:backend:
    desc: Run full generator benchmark suite (all pipelines, sizes, modes)
    dir: backend
    cmds:
      - go test -bench=BenchmarkPipeline -benchtime=3x -timeout=600s ./internal/generator/ -run='^$'

  bench:backend:solvers:
    desc: Run solver comparison benchmarks (Backtrack vs Propagation)
    dir: backend
    cmds:
      - go test -bench=BenchmarkSolver -benchtime=3x -timeout=60s ./internal/generator/ -run='^$'

  bench:backend:all:
    desc: Run all benchmarks including solver comparison and legacy
    dir: backend
    cmds:
      - go test -bench=. -benchtime=3x -timeout=600s ./internal/generator/ -run='^$'

  dev:localstack:
    desc: Start LocalStack (DynamoDB + SQS)
    cmds:
      - docker compose up localstack

  dev:backend:
    desc: Start backend dev server with LocalStack endpoints
    dir: backend
    env:
      DYNAMODB_ENDPOINT: http://localhost:4566
      SQS_ENDPOINT: http://localhost:4566
      SQS_QUEUE_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/puzzle-generation
      AWS_REGION: us-east-1
      PUZZLE_TABLE_NAME: puzzle-pool
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    cmds:
      - go run ./cmd/api

  dev:generator:
    desc: Start SQS consumer with LocalStack env vars
    dir: backend
    env:
      GENERATOR_MODE: sqs
      DYNAMODB_ENDPOINT: http://localhost:4566
      SQS_ENDPOINT: http://localhost:4566
      SQS_QUEUE_URL: http://sqs.us-east-1.localhost.localstack.cloud:4566/000000000000/puzzle-generation
      AWS_REGION: us-east-1
      PUZZLE_TABLE_NAME: puzzle-pool
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    cmds:
      - go run ./cmd/api

  build:frontend:
    desc: Build the frontend
    dir: frontend
    cmds:
      - npm run build

  test:frontend:
    desc: Run frontend tests
    dir: frontend
    cmds:
      - npm test

  dev:frontend:
    desc: Start frontend dev server (port 5180, network accessible)
    dir: frontend
    cmds:
      - npm run dev -- --host 0.0.0.0

  build:
    desc: Build backend and frontend
    deps:
      - build:backend
      - build:frontend

  test:
    desc: Run all tests
    deps:
      - test:backend
      - test:frontend

  deploy:
    desc: Deploy infrastructure via Terraform
    deps:
      - build
    dir: infra
    cmds:
      - terraform apply
