version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - "area:devops"
      - "type:infra"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels:
      - "area:frontend"
      - "type:infra"
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    labels:
      - "area:backend"
      - "type:infra"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]
