version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - "area:devops"
      - "type:infra"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    labels:
      - "area:frontend"
      - "type:infra"
    groups:
      frontend-minor-patch:
        update-types: ["minor", "patch"]
    # eslint 10 is held until eslint-plugin-react and eslint-plugin-import
    # ship eslint ^10 peer support (see #251). The major bump breaks the
    # npm peer graph, which this repo refuses to override. Minor/patch
    # eslint bumps still flow via the frontend-minor-patch group above.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    labels:
      - "area:backend"
      - "type:infra"
    groups:
      backend-minor-patch:
        update-types: ["minor", "patch"]
