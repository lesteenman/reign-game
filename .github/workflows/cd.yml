name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: aws-actions/configure-aws-credentials@99214aa6889fcddfa57764031d71add364327e59 # v6.1.3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.3"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build reproducible Lambda zip
        run: task build:lambda

      - name: Frontend install dependencies
        working-directory: frontend
        run: npm ci

      - name: Terraform Init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_VAR_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_VAR_TERRAFORM_STATE_PREFIX }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Apply
        working-directory: infra
        env:
          # Initial-apply-only inputs for the Clerk SSM parameters. Both
          # parameters use lifecycle { ignore_changes = [value] }, so
          # rotating these values requires changing them in the SSM
          # console — Terraform will not overwrite later updates. Empty
          # default in variables.tf keeps `terraform plan` working in CI
          # (PR context) where the secrets aren't available.
          TF_VAR_clerk_publishable_key: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          TF_VAR_clerk_secret_key: ${{ secrets.CLERK_SECRET_KEY }}
          # Custom-domain wiring. Both default to empty in
          # variables.tf, so the apply is a no-op until the GH repo
          # variables are populated. ACM_CERTIFICATE_ARN must be an
          # ISSUED us-east-1 cert covering every entry in
          # DOMAIN_ALIASES (JSON list, e.g. '["reign.acc.steenman.me"]').
          # See docs/runbooks/custom-domain.md.
          TF_VAR_domain_aliases: ${{ vars.DOMAIN_ALIASES }}
          TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="lambda_zip_path=${{ github.workspace }}/backend/build/lambda.zip" \
            -var="daily_cron_lambda_zip_path=${{ github.workspace }}/backend/build/daily-cron.zip"

      - name: Fetch Clerk publishable key from SSM
        id: clerk
        run: |
          # Read the publishable key from the SSM parameter created by
          # Terraform on the previous step. SSM is the source of truth so
          # rotations done in the SSM console flow through to subsequent
          # frontend builds without a Terraform change.
          PARAM_NAME=$(terraform -chdir=infra output -raw clerk_publishable_key_param_name)
          PUBLISHABLE_KEY=$(aws ssm get-parameter \
            --name "${PARAM_NAME}" \
            --query 'Parameter.Value' \
            --output text)
          # Mask before exporting so it never appears in subsequent log
          # output even though publishable keys are browser-safe.
          echo "::add-mask::${PUBLISHABLE_KEY}"
          echo "publishable_key=${PUBLISHABLE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Fetch API Gateway client key from Terraform
        id: api_key
        run: |
          # Browser-distributed API key bound to the client usage plan.
          # AWS auto-generates the value; Terraform exports it as a
          # sensitive output. Frontend bakes it into the bundle so every
          # /api/* request carries `x-api-key` and binds to the usage
          # plan's per-key throttle.
          API_KEY=$(terraform -chdir=infra output -raw client_api_key_value)
          # Mask even though it's browser-public — keeps it out of build logs.
          echo "::add-mask::${API_KEY}"
          echo "value=${API_KEY}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ steps.clerk.outputs.publishable_key }}
          VITE_API_KEY: ${{ steps.api_key.outputs.value }}
        run: npm run build

      - name: Sync frontend to S3
        run: |
          BUCKET=$(terraform -chdir=infra output -raw frontend_bucket_name)
          aws s3 sync frontend/dist/ "s3://${BUCKET}" --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(terraform -chdir=infra output -raw frontend_distribution_id)
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths "/*"
