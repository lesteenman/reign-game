name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  deployments: write # create the acc Deployment record (#241)

# Serialize deploys. `terraform apply` takes the S3 state lock; concurrent
# applies from rapid merges race that lock and fail ("Error acquiring the
# state lock"). Queueing (cancel-in-progress: false) is mandatory here — a
# mid-apply must never be interrupted, and every merged commit must deploy.
concurrency:
  group: cd-acc
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    # Attaching the job to the `acc` Environment does two things:
    # (1) the deploy secrets/vars resolve from the environment (the bare
    # repo-level copies were retired — see infra/CLAUDE.md), and (2) GitHub
    # auto-creates a Deployment record + status for acc (visible in the
    # Environments view / PR timeline) with no extra script. The post-deploy
    # verification step below is the job's last step, so a failed check
    # fails the job and the Deployment auto-marks `failure`.
    # NOTE: this changes the OIDC `sub` to `repo:...:environment:acc` — the
    # deploy role's trust policy must allow that subject (#241).
    environment:
      name: acc
      url: https://reign.acc.steenman.me
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: aws-actions/configure-aws-credentials@254c19bd240aabef8777f48595e9d2d7b972184b # v6.2.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.4"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build reproducible Lambda zip
        run: task build:lambda

      # Single root lockfile — npm workspaces install frontend + @reign/core.
      - name: Frontend install dependencies
        run: npm ci

      - name: Terraform Init
        working-directory: infra/envs/acc
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_VAR_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_VAR_TERRAFORM_STATE_PREFIX }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Apply
        working-directory: infra/envs/acc
        env:
          # Initial-apply-only inputs for the Clerk SSM parameters. Both
          # parameters use lifecycle { ignore_changes = [value] }, so
          # rotating these values requires changing them in the SSM
          # console — Terraform will not overwrite later updates. Empty
          # default in variables.tf keeps `terraform plan` working in CI
          # (PR context) where the secrets aren't available.
          TF_VAR_clerk_publishable_key: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          TF_VAR_clerk_secret_key: ${{ secrets.CLERK_SECRET_KEY }}
          # Custom-domain wiring. Both default to empty in
          # variables.tf, so the apply is a no-op until the GH repo
          # variables are populated. ACM_CERTIFICATE_ARN must be an
          # ISSUED us-east-1 cert covering every entry in
          # DOMAIN_ALIASES (JSON list, e.g. '["reign.acc.steenman.me"]').
          # See docs/runbooks/custom-domain.md.
          TF_VAR_domain_aliases: ${{ vars.DOMAIN_ALIASES }}
          TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
        run: |
          terraform apply -auto-approve \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="lambda_zip_path=${{ github.workspace }}/backend/build/lambda.zip" \
            -var="daily_cron_lambda_zip_path=${{ github.workspace }}/backend/build/daily-cron.zip"

      - name: Fetch Clerk publishable key from SSM
        id: clerk
        run: |
          # Read the publishable key from the SSM parameter created by
          # Terraform on the previous step. SSM is the source of truth so
          # rotations done in the SSM console flow through to subsequent
          # frontend builds without a Terraform change.
          PARAM_NAME=$(terraform -chdir=infra/envs/acc output -raw clerk_publishable_key_param_name)
          PUBLISHABLE_KEY=$(aws ssm get-parameter \
            --name "${PARAM_NAME}" \
            --query 'Parameter.Value' \
            --output text)
          # Mask before exporting so it never appears in subsequent log
          # output even though publishable keys are browser-safe.
          echo "::add-mask::${PUBLISHABLE_KEY}"
          echo "publishable_key=${PUBLISHABLE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Fetch API Gateway client key from Terraform
        id: api_key
        run: |
          # Browser-distributed API key bound to the client usage plan.
          # AWS auto-generates the value; Terraform exports it as a
          # sensitive output. Frontend bakes it into the bundle so every
          # /api/* request carries `x-api-key` and binds to the usage
          # plan's per-key throttle.
          API_KEY=$(terraform -chdir=infra/envs/acc output -raw client_api_key_value)
          # Mask even though it's browser-public — keeps it out of build logs.
          echo "::add-mask::${API_KEY}"
          echo "value=${API_KEY}" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ steps.clerk.outputs.publishable_key }}
          VITE_API_KEY: ${{ steps.api_key.outputs.value }}
        run: npm run build

      - name: Sync frontend to S3
        run: |
          BUCKET=$(terraform -chdir=infra/envs/acc output -raw frontend_bucket_name)
          # Pass 1: immutable hashed assets (everything except the HTML shell + SW).
          # --exclude also keeps these two out of the --delete sweep, so they're not removed here.
          aws s3 sync frontend/dist/ "s3://${BUCKET}" --delete \
            --exclude "index.html" --exclude "sw.js" \
            --cache-control "public, max-age=31536000, immutable"
          # Pass 2: HTML shell + SW must always revalidate so new deploys are picked up.
          aws s3 cp frontend/dist/index.html "s3://${BUCKET}/index.html" --cache-control "no-cache, must-revalidate"
          aws s3 cp frontend/dist/sw.js "s3://${BUCKET}/sw.js" --cache-control "no-cache, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(terraform -chdir=infra/envs/acc output -raw frontend_distribution_id)
          aws cloudfront create-invalidation --distribution-id "${DIST_ID}" --paths "/*"

      # Post-deploy verification — gates the (native) acc Deployment status.
      # Last step of the job, so a failure marks the Deployment `failure`.
      # Probes the live site; receives the browser-public (masked) API key
      # so it can assert api-key enforcement (keyed 200 / keyless 403).
      # See frontend/scripts/verify-deploy.mjs.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Post-deploy verification
        working-directory: frontend
        env:
          API_KEY: ${{ steps.api_key.outputs.value }}
        run: node scripts/verify-deploy.mjs https://reign.acc.steenman.me
