name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        # -short matches the pre-push hook (.githooks/pre-push). The long
        # generator tests (TestStep7Gate, TestPropertyCorpus,
        # TestGenerateRespectsMinSize) are `testing.Short()`-guarded and
        # run via .github/workflows/generator-check.yml with -tags=soak
        # and a 40-min timeout, not here. See CLAUDE.md lesson 20.
        run: go test -short ./... -v

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
          install-mode: goinstall
          version: v1.64.8

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: true

      # Two-pass init: newer Terraform versions reject `terraform validate`
      # against a partial backend block (the empty `backend "s3" {}` in
      # infra/backend.tf) even when init has succeeded with -backend-config
      # flags. HashiCorp's recommended pattern is to init with -backend=false
      # for source-only checks (validate, fmt) and re-init with the real
      # backend before plan/apply.
      - name: Terraform Init (no backend)
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Build Lambda zip for accurate plan
        run: |
          cd ${{ github.workspace }}/backend
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bootstrap ./cmd/api
          zip -j lambda.zip bootstrap

      - name: Terraform Init (with backend)
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=${{ secrets.TF_VAR_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_VAR_TERRAFORM_STATE_PREFIX }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="lambda_zip_path=${{ github.workspace }}/backend/lambda.zip"
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v9
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          PLAN_RESULT: ${{ steps.plan.outcome }}
        with:
          script: |
            const output = `#### Terraform Plan\n\`\`\`\n${process.env.PLAN_OUTPUT}\n\`\`\`\n\n*Result: \`${process.env.PLAN_RESULT}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Go Vulnerability Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...

      - name: NPM Audit
        run: cd frontend && npm audit --package-lock-only --audit-level=moderate
