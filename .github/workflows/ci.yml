name: CI

on:
  pull_request:
    branches: [main]

# Cancel in-progress runs only on PRs (rapid feedback on rebase / push).
# The conditional shape preserves correctness if a future `push: branches: [main]`
# trigger is added — main runs should NEVER cancel, so every merged commit
# leaves a green CI run on the timeline. Decision 9 in design.md, CW-02.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.3"
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Test
        # -short matches the pre-push hook (.githooks/pre-push). The long
        # generator tests (TestStep7Gate, TestPropertyCorpus,
        # TestGenerateRespectsMinSize) are `testing.Short()`-guarded and
        # run via .github/workflows/generator-check.yml with -tags=soak
        # and a 40-min timeout, not here. See CLAUDE.md lesson 20.
        run: go test -short ./... -v

      - name: Lint
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          working-directory: backend
          install-mode: goinstall
          version: v2.11.4

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  frontend-integration:
    name: Frontend Integration
    # Playwright integration project: real frontend, mocked /api/* via
    # page.route. No backend, no LocalStack. Independent of the
    # `frontend` job above (parallel runners, separate failure surface,
    # separate artifact set). Required-check from day one (CW-30).
    # CW-03, CW-06, CW-15, CW-16, CW-17, CW-20, CW-22, CW-24, CW-27, CW-32.
    runs-on: ubuntu-latest
    env:
      # Vite bakes VITE_CLERK_PUBLISHABLE_KEY into the SPA bundle at
      # startup. Without it, the SPA boots in Clerk-less mode (no
      # ClerkProvider), which crashes useUser() calls in GamePage /
      # LandingPage. The publishable key is explicitly browser-safe
      # per docs/runbooks/admin-auth-setup.md Path C — exposing it to
      # every step in the job (including npm ci) carries no
      # supply-chain risk. The secret key (CLERK_SECRET_KEY) is NOT
      # set here — the integration job has no backend.
      # Env-mapping: GitHub secret named CLERK_PUBLISHABLE_KEY (the Path A
      # name, shared with the CD pipeline) is exposed to Vite under the
      # VITE_-prefixed env var name that Vite requires for browser-bundle
      # injection. Same value, two names — no separate Path C secret.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Cache Playwright browsers (chromium only — see step below).
      # Key includes the lockfile hash; any frontend dep change refreshes
      # the cache. Conservative on purpose (Finding 3 in
      # design-grill-summary.md): a narrower key risks serving a stale
      # browser when Playwright bumps its bundled binary without a
      # playwright-core major bump.
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        run: npm ci

      # Only chromium — playwright.config.ts pins browserName: 'chromium'
      # for both projects. Skipping firefox + webkit avoids ~60 s of
      # unnecessary download (CW-17).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run integration project
        run: npm run test:integration

      # Failure-only artifact upload (CW-24..CW-27). if-no-files-found:
      # ignore prevents the upload step from failing when the run died
      # before reports were written. Retention 7 days matches GH default
      # and is plenty for "the PR author looks once."
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-integration-report
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/playwright-report/
            frontend/test-results/

  frontend-e2e:
    name: Frontend E2E
    # Playwright e2e project: real e2e backend on :5182 + Vite proxy on
    # :5183 + LocalStack DynamoDB (puzzle-pool-e2e) + seeded fixtures.
    # Lifecycle reuses `task e2e:up` (decision 6 / CW-09). The
    # auth.spec.ts "sign-in button" test runs (un-skipped) as soon as
    # VITE_CLERK_PUBLISHABLE_KEY is present in the env (CW-23).
    # CW-04, CW-07..CW-11, CW-14..CW-18, CW-21..CW-23, CW-28, CW-29, CW-33.
    #
    # Working directory is repo root because `task e2e:up` orchestrates
    # tasks in multiple `dir:`-scoped subtasks. npm scripts that run in
    # frontend/ set working-directory per-step.
    runs-on: ubuntu-latest
    env:
      # Same rationale as frontend-integration: VITE_CLERK_PUBLISHABLE_KEY
      # must be visible when Vite starts (inside `task e2e:up:frontend`)
      # so the SPA bundle gets it baked in. Browser-safe per Path C.
      # CLERK_SECRET_KEY is NOT set here — it stays step-scoped on
      # `task e2e:up` only, closing the supply-chain exfiltration window
      # via npm ci. (See PR-#89 review-local Security MAJOR finding.)
      # Env-mapping: GitHub secret named CLERK_PUBLISHABLE_KEY (the Path A
      # name, shared with the CD pipeline) is exposed to Vite under the
      # VITE_-prefixed env var name that Vite requires for browser-bundle
      # injection. Same value, two names — no separate Path C secret.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Go is needed because `task e2e:up:backend` runs `go run ./cmd/api`
      # against the e2e env. setup-go's built-in cache hits the same
      # backend/go.sum the Backend job populates (CW-14).
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.3"
          cache-dependency-path: backend/go.sum

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # task dev:up:localstack starts LocalStack via the existing
      # docker-compose.yml (image pinned to localstack/localstack:4.14.0
      # per CLAUDE.md lesson 22), runs the .localstack/init-aws.sh seed
      # script (creates puzzle-pool, puzzle-pool-e2e, queues, CONFIG
      # rows), and gates on BOTH /_localstack/health AND the queue +
      # table being ACTIVE. Reusing the local task means CI inherits
      # any future readiness fixes for free (CW-08, lesson 14).
      - name: Start LocalStack and wait for init
        run: task dev:up:localstack

      # task e2e:up brings up the e2e backend on :5182, the e2e Vite
      # proxy on :5183, seeds fixtures into puzzle-pool-e2e, and warms
      # /api/config/modes to defuse KI-022's DDB cold start. Per
      # CLAUDE.md lesson 25, do not split warmup or seeding into the
      # workflow — keep the lifecycle in the task.
      # Step-level env: CLERK_SECRET_KEY is supply-chain-sensitive
      # (a malicious npm postinstall earlier in the job could exfiltrate
      # it). Scope to only this step — the e2e backend (booted by
      # `task e2e:up:backend`) reads it at startup and no later step
      # needs it. VITE_CLERK_PUBLISHABLE_KEY is at job-level (browser-
      # safe). Dev-tenant keys ONLY (CW-12, design-grill Finding 1).
      - name: Bring up e2e stack
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
        run: task e2e:up

      # Step-level env: test-user credentials are consumed by Playwright's
      # sign-in helpers (auth.spec.ts admin-route gate, admin-config-flow,
      # pool-replenishment, dynamic-modes), not by Vite, not by the bundle.
      # Scope to this step only — same supply-chain discipline as
      # CLERK_SECRET_KEY above (a malicious npm postinstall earlier in the
      # job cannot read these). Dev-tenant credentials ONLY (D2). Mirror
      # these in BOTH Actions and Dependabot secret scopes per D3 — see
      # docs/runbooks/e2e-clerk-setup.md.
      #
      # CLERK_SECRET_KEY is also re-scoped to this step (in addition to
      # `Bring up e2e stack`) because Playwright's globalSetup invokes
      # `clerkSetup({ publishableKey, secretKey })` to fetch the testing
      # token — `clerkSetup` requires both keys per @clerk/testing's API.
      # Keeping it step-scoped (rather than hoisting to job level) preserves
      # the npm-postinstall-can't-read-it guarantee.
      - name: Run e2e project
        working-directory: frontend
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_TEST_USER_EMAIL: ${{ secrets.E2E_CLERK_TEST_USER_EMAIL }}
          # E2E_CLERK_TEST_*_PASSWORD: stored and step-scoped here for future
          # test flexibility (e.g. password-strategy admin sign-in via Clerk's
          # hosted UI). The current Playwright sign-in helpers use the
          # email-ticket strategy and do not read these values — see
          # frontend/playwright/test-helpers/clerk.ts. Wiring intact so a
          # future password-strategy spec doesn't need a CI change.
          E2E_CLERK_TEST_USER_PASSWORD: ${{ secrets.E2E_CLERK_TEST_USER_PASSWORD }}
          E2E_CLERK_TEST_ADMIN_EMAIL: ${{ secrets.E2E_CLERK_TEST_ADMIN_EMAIL }}
          E2E_CLERK_TEST_ADMIN_PASSWORD: ${{ secrets.E2E_CLERK_TEST_ADMIN_PASSWORD }}
        run: npm run test:e2e

      # Always-run cleanup. Runner is ephemeral so cleanup is mostly
      # cosmetic, but the pattern keeps a future self-hosted-runner
      # migration safe (CW-29).
      - name: Tear down e2e stack
        if: always()
        run: |
          task e2e:down || true
          docker compose down localstack || true

      # Failure-only artifact upload — adds backend + frontend logs to
      # the standard Playwright reports so failures with stack traces
      # in backend output are diagnosable post-hoc (CW-28).
      - name: Upload Playwright report and logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-e2e-report
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/playwright-report/
            frontend/test-results/
            logs/e2e-backend.log
            logs/e2e-frontend.log

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    # Dependabot PRs run with the read-only Dependabot context and have no access
    # to repo Actions secrets (AWS_ROLE_ARN, TF_VAR_TERRAFORM_STATE_BUCKET), so
    # configure-aws-credentials fails before doing anything. Dependabot bumps
    # don't touch infra/** anyway — skip the plan for them.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.3"
          cache-dependency-path: backend/go.sum

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: true

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_VAR_TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_VAR_TERRAFORM_STATE_PREFIX }}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Build reproducible Lambda zip
        working-directory: ${{ github.workspace }}
        run: task build:lambda

      - name: Terraform Plan
        id: plan
        # Pass the same TF_VAR_* env vars that CD apply uses (see cd.yml).
        # Without these, the plan falls back to variables.tf defaults
        # (domain_aliases=[], acm_certificate_arn=""), which makes the
        # CloudFront aliases expression compute to [] and the plan show a
        # phantom diff removing reign.acc.steenman.me on every PR. CD apply
        # always carries the real values via env, so the diff never runs —
        # but it scares reviewers and breaks the "no comment on no-op
        # plans" auto-suppression. Closes #155. The lesson "CI plan must
        # take the same -var set as CD apply" was captured on 2026-05-08
        # but never applied to the workflow until now.
        env:
          TF_VAR_clerk_publishable_key: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          TF_VAR_clerk_secret_key: ${{ secrets.CLERK_SECRET_KEY }}
          TF_VAR_domain_aliases: ${{ vars.DOMAIN_ALIASES }}
          TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
        run: |
          terraform plan -no-color -out=tfplan \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="lambda_zip_path=${{ github.workspace }}/backend/build/lambda.zip" \
            -var="daily_cron_lambda_zip_path=${{ github.workspace }}/backend/build/daily-cron.zip"
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_OUTPUT: ${{ steps.plan.outputs.stdout }}
          PLAN_RESULT: ${{ steps.plan.outcome }}
        with:
          script: |
            const planOutput = process.env.PLAN_OUTPUT || '';
            const planResult = process.env.PLAN_RESULT || 'success';

            // Suppress empty-plan comments to keep PRs that don't touch infra clean.
            // Heuristic markers (any one is sufficient): "No changes." or
            // "Plan: 0 to add, 0 to change, 0 to destroy.". A failed plan
            // (planResult !== 'success') ALWAYS comments so the failure is visible.
            const isClean =
              planResult === 'success' &&
              (planOutput.includes('No changes.') ||
               /Plan: 0 to add, 0 to change, 0 to destroy\./.test(planOutput));

            if (isClean) {
              console.log('Terraform plan shows no infra changes; skipping PR comment.');
              return;
            }

            const body = `#### Terraform Plan\n\`\`\`\n${planOutput}\n\`\`\`\n\n*Result: \`${planResult}\`*`;

            // Dedupe against the most recent identical github-actions tf-plan
            // comment on this PR. Multiple pushes whose plan output is byte-
            // identical to the previous comment skip — no point posting the
            // same diff over and over. Keeps PR conversation clean while still
            // posting on every genuinely-different plan (and on every failure,
            // since failures don't reach this branch).
            const { data: existingComments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const previousPlanComment = [...existingComments]
              .reverse()
              .find(
                (c) =>
                  c.user?.login === 'github-actions[bot]' &&
                  typeof c.body === 'string' &&
                  c.body.startsWith('#### Terraform Plan'),
              );
            // Terraform parallelizes state refreshes, so the ordering of
            // "Refreshing state..." / "Reading..." lines in the plan output
            // is non-deterministic. Strip the refresh preamble and compare
            // only what comes after the deterministic marker — the real
            // plan content (resource changes + "Plan: ..." summary) is what
            // reviewers actually care about.
            const normalize = (planBody) => {
              const markerIdx = planBody.search(
                /Terraform used the selected providers|No changes\./,
              );
              return markerIdx >= 0 ? planBody.slice(markerIdx) : planBody;
            };

            if (
              previousPlanComment &&
              normalize(previousPlanComment.body) === normalize(body)
            ) {
              console.log(
                'Terraform plan output identical to previous PR comment ' +
                  '(after refresh-order normalization); skipping post.',
              );
              return;
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.3"
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Go Vulnerability Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && govulncheck ./...

      - name: NPM Audit
        run: cd frontend && npm audit --package-lock-only --audit-level=moderate
